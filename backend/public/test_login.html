<!DOCTYPE html>
<html>
<head>
    <title>Test Login Direct</title>
</head>
<body>
    <h1>Test Login Direct</h1>
    <input type="email" id="email" value="super@demo.local" placeholder="Email">
    <input type="password" id="password" value="demo12345" placeholder="Password">
    <button id="loginBtn">Login</button>
    <div id="result"></div>

    <script>
    document.getElementById('loginBtn').addEventListener('click', async () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        console.log('Starting login with:', email);
        
        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ email, password })
            });
            
            console.log('Response status:', response.status);
            console.log('Response headers:', response.headers);
            
            const data = await response.json();
            console.log('Response data:', data);
            
            if (data.token) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                document.getElementById('result').innerHTML = '<h2 style="color:green">✅ Login Successful! Token saved.</h2>';
                console.log('Token saved, redirecting...');
                setTimeout(() => window.location.href = '/dashboard', 1000);
            }
        } catch (err) {
            console.error('Error:', err);
            document.getElementById('result').innerHTML = '<h2 style="color:red">❌ Error: ' + err.message + '</h2>';
        }
    });
    </script>
</body>
</html>
