<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGEC API Test Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { color: white; margin-bottom: 30px; text-align: center; }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .header p { font-size: 1.1em; opacity: 0.9; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; }
        
        .test-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        .test-card:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0,0,0,0.3); }
        
        .test-card h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .test-item {
            margin: 12px 0;
            padding: 10px;
            background: #f8f9fa;
            border-left: 3px solid #ccc;
            border-radius: 3px;
            font-size: 0.95em;
            transition: all 0.2s;
        }
        
        .test-item.pass {
            background: #d4edda;
            border-left-color: #28a745;
            color: #155724;
        }
        .test-item.fail {
            background: #f8d7da;
            border-left-color: #dc3545;
            color: #721c24;
        }
        .test-item.loading {
            background: #fff3cd;
            border-left-color: #ffc107;
            color: #856404;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .test-label {
            font-weight: 600;
            display: block;
            margin-bottom: 4px;
        }
        
        .test-result {
            font-family: monospace;
            font-size: 0.85em;
            margin-top: 5px;
            word-break: break-all;
            opacity: 0.8;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-run {
            background: #667eea;
            color: white;
        }
        .btn-run:hover { background: #5568d3; transform: scale(1.02); }
        .btn-run:disabled { background: #ccc; cursor: not-allowed; }
        
        .btn-clear {
            background: #6c757d;
            color: white;
        }
        .btn-clear:hover { background: #5a6268; }
        
        .stats {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            text-align: center;
        }
        
        .stat-item {
            padding: 10px;
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }
        
        .config-section {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .config-section h4 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .config-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .config-group input, .config-group select {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.9em;
        }
        
        .status-bar {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: blink 1s infinite;
        }
        
        .status-dot.online { background: #28a745; }
        .status-dot.offline { background: #dc3545; }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 SIGEC API Test Dashboard</h1>
            <p>Tests complets et en temps réel de tous les endpoints</p>
        </div>
        
        <div class="status-bar">
            <div class="status-indicator">
                <div class="status-dot online"></div>
                <span id="status">Prêt</span>
            </div>
            <div id="timestamp" style="color: #666; font-size: 0.9em;"></div>
        </div>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="stat-total">0</div>
                <div class="stat-label">Tests Total</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="stat-pass" style="color: #28a745;">0</div>
                <div class="stat-label">Réussis</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="stat-fail" style="color: #dc3545;">0</div>
                <div class="stat-label">Échoués</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="stat-rate" style="color: #ffc107;">0%</div>
                <div class="stat-label">Succès</div>
            </div>
        </div>
        
        <div class="config-section">
            <h4>⚙️ Configuration</h4>
            <div class="config-group">
                <input type="text" id="token" placeholder="Bearer Token" value="">
                <input type="text" id="tenantId" placeholder="Tenant ID" value="1">
                <input type="text" id="baseUrl" placeholder="Base URL" value="http://localhost:8000/api">
            </div>
            <div class="button-group">
                <button class="btn-run" onclick="runAllTests()">▶️ Exécuter Tous les Tests</button>
                <button class="btn-clear" onclick="clearResults()">🗑️ Effacer Résultats</button>
            </div>
        </div>
        
        <div class="grid" id="tests-container"></div>
    </div>

    <script>
        const CONFIG = {
            token: localStorage.getItem('sigec_token') || '',
            tenantId: localStorage.getItem('sigec_tenant') || '1',
            baseUrl: localStorage.getItem('sigec_url') || 'http://localhost:8000/api'
        };

        const TESTS = [
            {
                name: 'Authentication',
                tests: [
                    { label: 'GET /health', method: 'GET', url: '/health', requiresAuth: false },
                    { label: 'POST /login', method: 'POST', url: '/login', requiresAuth: false, body: { email: 'admin@demo.local', password: 'password' } },
                    { label: 'GET /me', method: 'GET', url: '/me', requiresAuth: true },
                ]
            },
            {
                name: 'Suppliers',
                tests: [
                    { label: 'GET /suppliers', method: 'GET', url: '/suppliers', requiresAuth: true },
                    { label: 'POST /suppliers', method: 'POST', url: '/suppliers', requiresAuth: true, body: { name: 'Test Supplier', email: 'test@supplier.com' } },
                ]
            },
            {
                name: 'Customers',
                tests: [
                    { label: 'GET /customers', method: 'GET', url: '/customers', requiresAuth: true },
                    { label: 'POST /customers', method: 'POST', url: '/customers', requiresAuth: true, body: { name: 'Test Customer', email: 'test@customer.com', category: 'retail' } },
                ]
            },
            {
                name: 'Expenses',
                tests: [
                    { label: 'GET /expenses', method: 'GET', url: '/expenses', requiresAuth: true },
                    { label: 'POST /expenses', method: 'POST', url: '/expenses', requiresAuth: true, body: { description: 'Test Expense', amount: 100, category: 'office', date: new Date().toISOString().split('T')[0] } },
                ]
            },
            {
                name: 'Products',
                tests: [
                    { label: 'GET /products', method: 'GET', url: '/products', requiresAuth: true },
                ]
            }
        ];

        let results = {};
        let globalToken = CONFIG.token;

        function updateConfig() {
            CONFIG.token = document.getElementById('token').value;
            CONFIG.tenantId = document.getElementById('tenantId').value;
            CONFIG.baseUrl = document.getElementById('baseUrl').value;
            localStorage.setItem('sigec_token', CONFIG.token);
            localStorage.setItem('sigec_tenant', CONFIG.tenantId);
            localStorage.setItem('sigec_url', CONFIG.baseUrl);
            globalToken = CONFIG.token;
        }

        function initUI() {
            document.getElementById('token').value = CONFIG.token;
            document.getElementById('tenantId').value = CONFIG.tenantId;
            document.getElementById('baseUrl').value = CONFIG.baseUrl;

            const container = document.getElementById('tests-container');
            TESTS.forEach(section => {
                const card = document.createElement('div');
                card.className = 'test-card';
                card.innerHTML = `
                    <h3>${section.name}</h3>
                    <div id="section-${section.name.replace(/\s+/g, '-').toLowerCase()}" class="section-results"></div>
                `;
                container.appendChild(card);
            });
        }

        async function runTest(test, sectionName) {
            const sectionId = `section-${sectionName.replace(/\s+/g, '-').toLowerCase()}`;
            const resultElement = document.getElementById(`test-${test.label}`);
            
            if (!resultElement) {
                const newEl = document.createElement('div');
                newEl.id = `test-${test.label}`;
                newEl.className = 'test-item loading';
                newEl.innerHTML = `<span class="test-label">${test.label}</span><span class="test-result">Chargement...</span>`;
                document.getElementById(sectionId).appendChild(newEl);
            }

            try {
                updateConfig();
                
                const headers = {
                    'Content-Type': 'application/json'
                };
                
                if (test.requiresAuth && globalToken) {
                    headers['Authorization'] = `Bearer ${globalToken}`;
                }
                
                if (test.requiresAuth) {
                    headers['X-Tenant-ID'] = CONFIG.tenantId;
                }

                const options = {
                    method: test.method,
                    headers: headers
                };

                if (test.body) {
                    options.body = JSON.stringify(test.body);
                }

                const response = await fetch(`${CONFIG.baseUrl}${test.url}`, options);
                const data = await response.json();

                let resultText = `Status: ${response.status}`;
                
                if (test.label === 'POST /login' && data.token) {
                    globalToken = data.token;
                    CONFIG.token = data.token;
                    document.getElementById('token').value = data.token;
                    localStorage.setItem('sigec_token', data.token);
                    resultText += ` | Token: ${data.token.substring(0, 20)}...`;
                }

                if (response.ok || response.status === 201) {
                    markTest(test.label, sectionId, true, resultText);
                } else {
                    markTest(test.label, sectionId, false, `${resultText} | ${JSON.stringify(data).substring(0, 80)}`);
                }

            } catch (err) {
                markTest(test.label, sectionId, false, `Erreur: ${err.message}`);
            }
        }

        function markTest(label, sectionId, passed, message) {
            const el = document.getElementById(`test-${label}`);
            el.className = `test-item ${passed ? 'pass' : 'fail'}`;
            el.innerHTML = `
                <span class="test-label">${passed ? '✅' : '❌'} ${label}</span>
                <span class="test-result">${message}</span>
            `;
            updateStats();
        }

        function updateStats() {
            const allItems = document.querySelectorAll('.test-item:not(.loading)');
            const passes = document.querySelectorAll('.test-item.pass').length;
            const fails = document.querySelectorAll('.test-item.fail').length;
            const total = passes + fails;
            const rate = total > 0 ? Math.round((passes / total) * 100) : 0;

            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-pass').textContent = passes;
            document.getElementById('stat-fail').textContent = fails;
            document.getElementById('stat-rate').textContent = rate + '%';
        }

        async function runAllTests() {
            document.getElementById('status').textContent = 'Tests en cours...';
            const runBtn = event.target;
            runBtn.disabled = true;

            for (const section of TESTS) {
                for (const test of section.tests) {
                    await runTest(test, section.name);
                    await new Promise(resolve => setTimeout(resolve, 200));
                }
            }

            document.getElementById('status').textContent = '✅ Tests terminés';
            runBtn.disabled = false;
            updateTimestamp();
        }

        function clearResults() {
            const items = document.querySelectorAll('.test-item');
            items.forEach(item => item.remove());
            document.getElementById('stat-total').textContent = '0';
            document.getElementById('stat-pass').textContent = '0';
            document.getElementById('stat-fail').textContent = '0';
            document.getElementById('stat-rate').textContent = '0%';
            document.getElementById('status').textContent = 'Prêt';
        }

        function updateTimestamp() {
            const now = new Date();
            document.getElementById('timestamp').textContent = now.toLocaleTimeString('fr-FR');
        }

        setInterval(updateTimestamp, 1000);
        initUI();
    </script>
</body>
</html>
